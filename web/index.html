<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeskPulse</title>
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/views.css">
</head>
<body>
    <div id="navRail">
        <div class="nav-top">
            <button class="nav-btn active" data-tab="home" id="tab-home"></button>
            <button class="nav-btn" data-tab="pc" id="tab-pc"></button>
            <button class="nav-btn" data-tab="ai" id="tab-ai"></button>
            <button class="nav-btn" data-tab="agenda" id="tab-agenda"></button>
            <button class="nav-btn" data-tab="weather" id="tab-weather"></button>
            <button class="nav-btn" data-tab="media" id="tab-media"></button>
            <button class="nav-btn" data-tab="github" id="tab-github"></button>
            <button class="nav-btn" data-tab="shortcuts" id="tab-shortcuts"></button>
            <button class="nav-btn" data-tab="timer" id="tab-timer"></button>
        </div>
        <div class="nav-bottom">
            <button class="nav-btn" id="fullscreenBtn"></button>
            <div id="connectionStatus" class="status-dot green"></div>
        </div>
    </div>

    <div id="viewsStage">
        <section id="view-home" class="view active"></section>
        <section id="view-pc" class="view"></section>
        <section id="view-ai" class="view"></section>
        <section id="view-agenda" class="view"></section>
        <section id="view-weather" class="view"></section>
        <section id="view-media" class="view"></section>
        <section id="view-github" class="view"></section>
        <section id="view-shortcuts" class="view"></section>
        <section id="view-timer" class="view"></section>
    </div>

    <div id="screensaverOverlay" class="screensaver-overlay hidden">
        <div class="screensaver-clock"></div>
    </div>

    <div id="approvalOverlay" class="approval-overlay hidden">
        <div class="approval-card">
            <h3 class="approval-title"></h3>
            <p class="approval-message"></p>
            <div class="approval-actions">
                <button class="btn-deny">Negar</button>
                <button class="btn-pc">Responder no PC</button>
                <button class="btn-allow">Permitir</button>
            </div>
            <div class="approval-progress"></div>
        </div>
    </div>

    <div id="tokenOverlay" class="token-overlay hidden">
        <div class="token-card">
            <h3>Autenticação Necessária</h3>
            <input type="password" id="tokenInput" placeholder="DeskPulse Token">
            <button id="tokenSubmit">Salvar</button>
        </div>
    </div>

    <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
